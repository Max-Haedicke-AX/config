$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
resources:
  - name: InstallGit
    type: Microsoft.WinGet/Package
    properties:
      id: Git.Git
      source: winget
      _exist: true

  - name: InitDefaultBranch
    type: Microsoft.DSC.Transitional/RunCommandOnSet
    dependsOn:
      - "[resourceId('Microsoft.WinGet/Package','InstallGit')]"
    properties:
      executable: git
      arguments:
        - config
        - --global
        - init.defaultBranch
        - main

