  - name: PullRebase
    type: Microsoft.DSC.Transitional/RunCommandOnSet
    dependsOn:
      - "[resourceId('Microsoft.WinGet/Package','InstallGit')]"
    properties:
      executable: git
      arguments:
        - config
        - --global
        - pull.rebase
        - "true"

  - name: FetchPrune
    type: Microsoft.DSC.Transitional/RunCommandOnSet
    dependsOn:
      - "[resourceId('Microsoft.WinGet/Package','InstallGit')]"
    properties:
      executable: git
      arguments:
        - config
        - --global
        - fetch.prune
        - "true"

  - name: CredentialManager
    type: Microsoft.DSC.Transitional/RunCommandOnSet
    dependsOn:
      - "[resourceId('Microsoft.WinGet/Package','InstallGit')]"
    properties:
      executable: git
      arguments:
        - config
        - --global
        - credential.helper
        - manager

  - name: LongPaths
    type: Microsoft.DSC.Transitional/RunCommandOnSet
    dependsOn:
      - "[resourceId('Microsoft.WinGet/Package','InstallGit')]"
    properties:
      executable: git
      arguments:
        - config
        - --global
        - core.longpaths
        - "true"
