$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json

# Git merged-branch cleanup - Scheduled Task
#
# Registers a Windows Scheduled Task that deletes local Git branches whose
# remote branch was merged and deleted, across every repository under
# -Root. Runs Mondays and Thursdays at 12:00. Locking the screen does not
# stop the task (lock is not the same as logoff), so it keeps running in
# the background as long as the user stays logged on.
#
# Usage:
#   dsc config set --file Configurations\GitBranchCleanup-Task.dsc.yaml

parameters:

  RepositoryRoot:
    type: string
    defaultValue: C:\DEV
    description: Root directory containing the Git repositories.

  CleanupScriptPath:
    type: string
    defaultValue: C:\DEV\config\Configurations\Scripts\Remove-MergedBranchesInAllRepos.ps1
    description: Path to the PowerShell script executed by the scheduled task.

  RegistrationScriptPath:
    type: string
    defaultValue: C:\DEV\config\Configurations\Scripts\Register-GitBranchCleanupTask.ps1
    description: Path to the task registration helper script.

  LogPath:
    type: string
    defaultValue: C:\DEV\config\Logs\GitBranchCleanup.log
    description: Path to the transcript log written by scheduled runs.

  TaskName:
    type: string
    defaultValue: GitBranchCleanup
    description: Name of the Windows Scheduled Task.

resources:

  - name: RegisterGitBranchCleanupTask
    type: Microsoft.DSC.Transitional/RunCommandOnSet
    properties:
      executable: pwsh
      arguments:
        - -NonInteractive
        - -File
        - "[concat('', parameters('RegistrationScriptPath'))]"
        - -TaskName
        - "[concat('', parameters('TaskName'))]"
        - -RepositoryRoot
        - "[concat('', parameters('RepositoryRoot'))]"
        - -CleanupScriptPath
        - "[concat('', parameters('CleanupScriptPath'))]"
        - -LogPath
        - "[concat('', parameters('LogPath'))]"
